name: Fabrication Mac'n'Play

# Lancée à la main (onglet Actions) ou en poussant une étiquette vX.Y.Z :
# dans ce cas, le .dmg est publié dans une Release du même nom.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Mac'n'Play pour Mac Apple Silicon (macOS 15 et plus)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      # empreinte de MoltenVK v1.2.9 (MoltenVK-macos.tar), vérifiée à chaque téléchargement
      MOLTENVK_SHA256: 93369586b116bc027ef7121fd713ff32fcd856febcb4622b6ba527edcadd68ea
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Numéro de version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install protobuf
        run: |
          pip3 install --user 'protobuf>=5,<6' --break-system-packages

      - name: Install brew dependencies
        run: |
          brew update
          brew uninstall pkgconfig || true
          brew install --force qt@6 ffmpeg pkgconfig opus openssl@3.6 cmake ninja nasm protobuf@29 speexdsp libplacebo wget python-setuptools json-c miniupnpc libevent
          # « openssl@3 » désigne la 3.5 chez Homebrew : avec elle, les certificats des serveurs
          # de Sony ne sont plus vérifiés (profil PSN, consoles PS5). On prend donc la 3.6,
          # et les en-têtes et la bibliothèque viennent de la même version.
          brew unlink openssl@4 openssl@3 || true
          brew link --force --overwrite openssl@3.6
          "$(brew --prefix)/opt/openssl@3.6/bin/openssl" version

      - name: Install sdl2-compat
        run: |
          sudo INSTALL_PREFIX=/usr/local scripts/build-sdl2-compat.sh
          sudo cp /usr/local/lib/pkgconfig/sdl2-compat.pc /usr/local/lib/pkgconfig/sdl2.pc

      - name: Configure
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF -DMACNPLAY_VERSION="$VERSION" -DOPENSSL_ROOT_DIR="$(brew --prefix)/opt/openssl@3.6" -DCMAKE_PREFIX_PATH="$(brew --prefix)/opt/openssl@3.6;$(brew --prefix)/opt/qt@6;$(brew --prefix)/opt/protobuf@29"

      - name: Build
        run: |
          export CPATH=$(brew --prefix)/opt/ffmpeg/include
          cmake --build build --config Release --clean-first --target chiaki

      - name: Tests des règles
        run: |
          cmake --build build --config Release --target macnplay-rules-test
          ctest --test-dir build --output-on-failure -R macnplay-rules

      - name: Icône au format macOS 26
        run: |
          # l'icône « Liquid Glass » (gui/AppIcon.icon, format Icon Composer) se compile avec
          # l'outil actool de Xcode 26. Il plante parfois sur certaines machines GitHub :
          # on essaie chaque Xcode 26 installé, et sans succès l'appli garde l'ancienne icône.
          for XC in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -rV); do
            echo "Essai avec $XC"
            rm -rf icon-out && mkdir -p icon-out
            if DEVELOPER_DIR="$XC/Contents/Developer" xcrun actool gui/AppIcon.icon --compile icon-out \
                --app-icon AppIcon --enable-on-demand-resources NO --platform macosx --target-device mac \
                --minimum-deployment-target 15.0 --output-partial-info-plist icon-out/partial.plist >actool.log 2>&1 \
                && [[ -f icon-out/Assets.car ]]; then
              echo "Icône compilée avec $XC"
              ls -la icon-out
              exit 0
            fi
            tail -5 actool.log
          done
          # actool plante sur cette machine : on prend l'icône déjà compilée rangée dans le projet
          # (gui/AppIcon-compiled, à refaire quand gui/AppIcon.icon change)
          rm -rf icon-out && mkdir -p icon-out
          cp gui/AppIcon-compiled/Assets.car icon-out/
          echo "::warning::actool indisponible : icône macOS 26 précompilée utilisée (gui/AppIcon-compiled)"

      - name: Package
        run: |
          APP="Mac'n'Play.app"
          rm -rf "$APP" dmg Mac-n-Play-*.dmg
          cp -a build/gui/chiaki.app "$APP"
          cp scripts/qtwebengine_import.qml gui/src/qml/
          $(brew --prefix)/opt/qt@6/bin/macdeployqt "$APP" -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          mkdir -p "$APP/Contents/Resources/vulkan/icd.d"
          wget -q https://github.com/KhronosGroup/MoltenVK/releases/download/v1.2.9/MoltenVK-macos.tar
          # empreinte du fichier téléchargé : affichée à chaque fabrication, vérifiée dès qu'elle est connue
          echo "MoltenVK sha256 : $(shasum -a 256 MoltenVK-macos.tar | cut -d' ' -f1)"
          if [[ -n "${MOLTENVK_SHA256:-}" ]]; then echo "$MOLTENVK_SHA256  MoltenVK-macos.tar" | shasum -a 256 -c -; fi
          tar xf MoltenVK-macos.tar
          cp MoltenVK/MoltenVK/dylib/macOS/* "$APP/Contents/Resources/vulkan/icd.d"
          $(brew --prefix)/opt/qt@6/bin/macdeployqt "$APP" -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          if [[ -d "$APP/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app" ]]
          then
            ln -s ../../../../../../../Frameworks "$APP/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app/Contents"
          fi
          cp /usr/local/lib/libSDL3.dylib "$APP/Contents/MacOS/libSDL3.dylib"
          cp /usr/local/lib/libSDL2-2.0.0.dylib "$APP/Contents/MacOS/libSDL2-2.0.0.dylib"
          install_name_tool -id @executable_path/libSDL3.dylib "$APP/Contents/MacOS/libSDL3.dylib"
          install_name_tool -id @executable_path/libSDL2-2.0.0.dylib "$APP/Contents/MacOS/libSDL2-2.0.0.dylib"
          for old in /usr/local/lib/libSDL3.dylib @rpath/libSDL3.dylib /opt/homebrew/lib/libSDL3.dylib; do
            install_name_tool -change "$old" @executable_path/libSDL3.dylib "$APP/Contents/MacOS/libSDL2-2.0.0.dylib" || true
          done
          for old in /usr/local/lib/libSDL2-2.0.0.dylib @rpath/libSDL2-2.0.0.dylib /opt/homebrew/lib/libSDL2-2.0.0.dylib; do
            install_name_tool -change "$old" @executable_path/libSDL2-2.0.0.dylib "$APP/Contents/MacOS/chiaki" || true
          done
          ln -s libvulkan.1.dylib "$APP/Contents/Frameworks/vulkan"
          # icône macOS 26 : Assets.car + son nom dans Info.plist (l'ancienne .icns reste pour macOS 15)
          if [[ -f icon-out/Assets.car ]]; then
            cp icon-out/Assets.car "$APP/Contents/Resources/"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$APP/Contents/Info.plist" \
              || /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$APP/Contents/Info.plist"
          fi
          codesign --force --entitlements gui/entitlements.xml --deep --sign - "$APP"
          # fenêtre d'installation : l'appli et un raccourci vers Applications
          mkdir dmg && cp -a "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Mac'n'Play" -srcfolder dmg -format UDZO "Mac-n-Play-$VERSION.dmg"

      - name: Check minimum macOS
        run: |
          # aucune bibliothèque embarquée ne doit exiger plus récent que macOS 15
          bad=0
          while IFS= read -r f; do
            v=$(otool -l "$f" 2>/dev/null | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            if [[ -n "$v" && "${v%%.*}" -gt 15 ]]; then echo "trop récent ($v) : $f"; bad=1; fi
          done < <(find "Mac'n'Play.app" -type f \( -name '*.dylib' -o -perm +111 \))
          exit $bad

      - name: Check OpenSSL version
        run: |
          # la vérification des certificats de Sony échoue avec OpenSSL 3.5 : il faut la 3.6 ou plus récente
          v=$(strings "Mac'n'Play.app/Contents/Frameworks/libcrypto.3.dylib" | grep -m1 -oE 'OpenSSL 3\.[0-9]+' | cut -d. -f2)
          echo "OpenSSL 3.$v embarquée"
          [[ -n "$v" && "$v" -ge 6 ]]

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mac-n-Play-${{ env.VERSION }}
          path: Mac-n-Play-*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # une étiquette avec un tiret (v1.1.0-beta) est publiée en pré-version : elle ne devient pas
          # « la dernière version » (lien de téléchargement, Homebrew, bandeau de mise à jour)
          PRE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" Mac-n-Play-*.dmg $PRE --title "Mac'n'Play $VERSION" --notes-file RELEASE_NOTES.md

      - name: Update Homebrew cask
        # version définitive seulement : la recette Homebrew suit la dernière version stable
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: |
          SHA=$(shasum -a 256 Mac-n-Play-*.dmg | cut -d' ' -f1)
          git fetch -q origin main && git checkout -q -B main origin/main
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/macnplay.rb
          git diff --stat
          git -c user.name=Fr0gzilla -c user.email=242606097+Fr0gzilla@users.noreply.github.com commit -qam "Homebrew : Mac'n'Play $VERSION"
          git push -q origin main
